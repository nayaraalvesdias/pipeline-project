apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pipeline-project
  namespace: dev
spec:
  ingressClassName: nginx
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pipeline-project
                port:
                  number: 80